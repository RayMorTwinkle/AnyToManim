</style></head><body><main><h1>第二輪影片對照</h1><p>重點看畫面有沒有變滿、鏡頭有沒有幫上忙。旁白都是 macOS 本機語音，請不要評聲音。本輪降到中等思考強度，和高強度的影片比較時要記得這個差異。</p><section><h2>梯度下降</h2><p>靜止比例 39% → 33%，鏡頭 0 → 1 次，常駐標題已消失</p><div class="g"><figure class="new"><figcaption>本輪新 skill <span>Sol 中</span></figcaption><video src="videos/gradient-skill-v2.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>上輪新 skill <span>Sol 高</span></figcaption><video src="videos/gradient-skill-v1.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>舊工具 <span>Sol 高</span></figcaption><video src="videos/gradient-old-tools.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>隔離後不用工具 <span>Sol 中</span></figcaption><video src="videos/gradient-direct.mp4" controls preload="metadata" playsinline></video></figure></div></section><section><h2>傅立葉級數</h2><p>靜止比例 50% → 25%，鏡頭 0 → 3 次，常駐標題已消失</p><div class="g"><figure class="new"><figcaption>本輪新 skill <span>Sol 中</span></figcaption><video src="videos/fourier-skill-v2.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>上輪新 skill <span>Sol 高</span></figcaption><video src="videos/fourier-skill-v1.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>舊工具 <span>Sol 高</span></figcaption><video src="videos/fourier-old-tools.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>隔離後不用工具 <span>Sol 中</span></figcaption><video src="videos/fourier-direct.mp4" controls preload="metadata" playsinline></video></figure></div></section><section><h2>雜湊表</h2><p>靜止比例 35% → 19%，鏡頭 0 → 3 次，常駐標題已消失，但下半部仍常常全黑</p><div class="g"><figure class="new"><figcaption>本輪新 skill <span>Sol 中</span></figcaption><video src="videos/hashtable-skill-v2.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>上輪新 skill <span>Sol 高</span></figcaption><video src="videos/hashtable-skill-v1.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>舊工具 <span>Sol 高</span></figcaption><video src="videos/hashtable-old-tools.mp4" controls preload="metadata" playsinline></video></figure><figure class=""><figcaption>隔離後不用工具 <span>Sol 中</span></figcaption><video src="videos/hashtable-direct.mp4" controls preload="metadata" playsinline></video></figure></div></section></main></body></html>
